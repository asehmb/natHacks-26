# All lengths in mm. Mat frame: origin at the mat's bottom-left corner, x to the right, y towards the far edge, z up.
# Placeholders below: measure your own mat / arm placement and edit.
mat:
  width_mm: 400
  height_mm: 300
  marker_size_mm: 38.1        # black square of the printed ArUco marker (1.5 in prints exactly at 300 DPI)
  markers:                    # DICT_4X4_50 id -> marker centre on the mat
    0: [30, 30]
    1: [370, 30]
    2: [370, 270]
    3: [30, 270]
  min_markers: 2              # markers needed in a frame to (re)compute the mat pose

arm:
  base_xy_mm: [-60, 150]      # arm base axis position in the mat frame
  base_yaw_deg: 0             # direction of the arm's forward (x) axis in the mat frame
  mat_z_mm: 0                 # height of the mat surface in the arm base frame
  base_zone_radius_mm: 100    # foreground blobs touching this circle around the base are the arm
  gripper_marker_id: 10
  gripper_marker_size_mm: 30.48   # 1.2 in

vision:
  px_per_mm: 2.0              # resolution of the rectified top-down view
  diff_threshold: 18          # Lab distance from the empty-mat reference
  min_area_mm2: 150
  edge_margin_mm: 4           # ignore foreground this close to the mat edge
  grasp_inset_mm: 15
  grasp_z_mm: 15              # grasp height in the arm base frame
  round_aspect: 1.3           # below this length/width the object is grasped at its centroid
  use_near_half: false        # trim tall objects' lean using the camera-near half of the contour
  gate_mm: 40                 # tracker association gate
  max_missed: 15              # frames a non-occluded track survives without a detection
  ema: 0.5                    # weight of the new measurement in smoothing
  fov_deg: 60                 # horizontal FOV guess when no intrinsics file exists
