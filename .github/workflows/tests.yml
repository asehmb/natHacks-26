name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: nlp

jobs:
  # Parser, dialogue, dispatcher and fallback must work with nothing but pytest + numpy installed;
  # tests that need opencv / onnxruntime skip themselves.
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: nlp/pyproject.toml
      - run: pip install pytest numpy
      - run: python -m pytest -q

  # Everything, including video reading and provider selection (no model downloads, no network).
  vision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nlp/pyproject.toml
      - run: pip install pytest numpy opencv-python-headless onnxruntime tokenizers
      - run: python -m pytest -q -rs
